spring.application.name=secure-message-backend
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/securemessage}
spring.data.mongodb.database=securemessage
spring.data.mongodb.auto-index-creation=true
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
spring.mvc.problem-details.enabled=true
server.forward-headers-strategy=native
# Supervision
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=secure-message-backend
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s