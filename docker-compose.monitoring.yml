# =============================================================
# SecureMessage — Stack de supervision (C4.1.2)
# Lancement : docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# (ou fusionne ces services dans ton docker-compose.yml existant)
#
# Prérequis : backend et mongodb doivent être sur le MÊME réseau Docker.
# Adapte le nom du réseau externe ci-dessous (<projet>_default par défaut).
# =============================================================
services:

  prometheus:
    image: prom/prometheus:v3.13.2          # LTS supporté jusqu'à 07/2027
    container_name: sm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'   # exposé uniquement en local (accès via tunnel SSH)
    networks: [ securemess, monitoring ]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: sm-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      - '127.0.0.1:9093:9093'
    networks: [ monitoring ]

  grafana:
    image: grafana/grafana-oss:13.1.3
    container_name: sm-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?defini_moi}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://secure-mess.fr/grafana/   # si tu le passes derrière nginx
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    networks: [ monitoring ]
    depends_on: [ prometheus ]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sm-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    networks: [ monitoring ]

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    container_name: sm-mongodb-exporter
    restart: unless-stopped
    command:
      - '--mongodb.uri=${MONGODB_MONITOR_URI}'   # user dédié 'clusterMonitor', pas root
      - '--collect-all'
    networks: [ securemess, monitoring ]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: sm-blackbox-exporter
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [ monitoring ]

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Réseau applicatif EXISTANT (backend + mongodb). Adapte le nom !
  securemess:
    external: true
    name: securemess_default
  # Réseau interne dédié à la supervision
  monitoring:
    driver: bridge
