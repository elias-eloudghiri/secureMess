name: "🐛 Rapport d'anomalie"
description: "Signaler un bug ou un comportement inattendu de SecureMessage"
title: "[BUG] "
labels: [ "bug", "à trier" ]
body:
  - type: markdown
    attributes:
      value: |
        Merci de consigner cette anomalie de façon complète : cela permet de reproduire le problème et de déterminer le correctif à mettre en place.

  - type: textarea
    id: description
    attributes:
      label: Description de l'anomalie
      description: Décrire clairement et de manière concise le comportement observé.
      placeholder: "Ex. : L'envoi d'un message échoue avec une erreur « Bad MAC » après un changement d'appareil."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      description: Lister les étapes précises permettant de reproduire le bug.
      value: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Faire '...'
        4. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      placeholder: "Ce qui aurait dû se produire."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement obtenu
      placeholder: "Ce qui s'est réellement produit (message d'erreur exact si possible)."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Composant concerné
      options:
        - Frontend (React / Redux)
        - Backend (Spring Boot / API)
        - Chiffrement (Signal Protocol)
        - Infrastructure (Docker / nginx / MongoDB)
        - CI/CD (GitHub Actions)
        - Autre / Inconnu
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      description: Estimer l'impact sur la disponibilité et la sécurité.
      options:
        - "Critique — perte de données / faille de sécurité / service indisponible"
        - "Majeure — fonctionnalité principale inutilisable, sans contournement"
        - "Mineure — fonctionnalité dégradée, contournement possible"
        - "Cosmétique — problème d'affichage sans impact fonctionnel"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Préciser le contexte technique d'apparition.
      value: |
        - Environnement : [production secure-mess.fr / local / staging]
        - Navigateur + version : [ex. Chrome 128]
        - Version de l'application : [ex. v1.0.0 / commit SHA]
        - Système d'exploitation : [ex. Windows 11 / Android 14]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, captures d'écran, console
      description: Coller les logs backend, la sortie console navigateur, ou joindre des captures. (Rendu automatiquement en `code`.)
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai vérifié qu'aucune issue existante ne décrit déjà ce bug.
          required: true
        - label: J'ai fourni des étapes de reproduction claires.
          required: true