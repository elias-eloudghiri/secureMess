# =============================================================
# SecureMessage — blackbox_exporter (sonde de disponibilité externe)
# =============================================================
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # valid_status_codes vide => 2xx acceptés par défaut
      fail_if_not_ssl: true          # échoue si la connexion n'est PAS en HTTPS
      preferred_ip_protocol: "ip4"
      follow_redirects: true
