# =============================================================
# SecureMessage — Configuration Prometheus (C4.1.2 : sondes)
# Tous les tags d'images sont épinglés (reproductibilité dossier).
# Le suivi des mises à jour de ces images relève de C4.1.1 (Dependabot).
# =============================================================
global:
  scrape_interval: 15s        # fréquence de collecte des sondes
  evaluation_interval: 15s    # fréquence d'évaluation des règles d'alerte
  external_labels:
    project: securemessage
    env: prod

# --- Où envoyer les alertes déclenchées ---
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# --- Fichiers de règles d'alerte ---
rule_files:
  - /etc/prometheus/rules/*.yml

# --- Cibles à scraper (les "sondes") ---
scrape_configs:

  # 1) Prometheus lui-même (méta-supervision)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2) Backend Spring Boot — métriques Micrometer via Actuator
  - job_name: 'backend'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']     # nom du service backend dans docker-compose
        labels:
          service: securemessage-backend

  # 3) Hôte / VPS — node_exporter (CPU, RAM, disque, réseau)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: vps-host

  # 4) MongoDB — mongodb_exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: mongodb

  # 5) Disponibilité externe du site public — blackbox_exporter (probe HTTPS)
  - job_name: 'blackbox-https'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://secure-mess.fr
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
