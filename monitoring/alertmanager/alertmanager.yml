# =============================================================
# SecureMessage — Alertmanager (C4.1.2 : modalité des signalements)
# Canal : Discord (support natif discord_configs depuis v0.25).
# Le secret n'est PAS commité : on lit l'URL du webhook depuis un
# fichier monté (webhook_url_file) -> voir monitoring/alertmanager/.gitignore
# =============================================================
global:
  resolve_timeout: 5m

route:
  receiver: 'discord'
  group_by: ['alertname', 'severity']
  group_wait: 30s          # attend 30s pour regrouper des alertes liées
  group_interval: 5m
  repeat_interval: 4h      # ré-envoi si toujours actif (warnings)
  routes:
    # Les alertes critiques sont répétées plus souvent
    - matchers:
        - severity="critical"
      receiver: 'discord'
      repeat_interval: 1h

receivers:
  - name: 'discord'
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true   # notifie aussi quand l'incident est résolu

