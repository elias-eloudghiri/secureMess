services:
  mongodb:
    image: mongo:latest
    container_name: securemessage-mongo-prod
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb-data-prod:/data/db
    env_file:
      - .env
    networks:
      - secure-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    container_name: securemessage-backend-prod
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - secure-network

  frontend:
    build: ./front
    container_name: securemessage-frontend-prod
    env_file:
      - ./front/.env
    ports:
      - "443:443"
    depends_on:
      - backend
    networks:
      - secure-network
    volumes:
      - /var/www/secure-mess.fr/html/:/usr/share/nginx/html:ro
      - /etc/nginx/sites-available/secure-mess.fr:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/secure-mess.fr:/etc/letsencrypt/live/secure-mess.fr:ro
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/letsencrypt/options-ssl-nginx.conf:ro

volumes:
  mongo-data-prod:


networks:
  secure-network:
    driver: bridge
